<!DOCTYPE html>
<html>
<head>

    <title>Keyboard</title>

    <style>

        body {
            margin: 0;

            background-color: #0db9ca;
        }

        .keyboard {
            width: 700px;

            max-width: 95%;

            margin: 80px auto;

            padding: 15px;

            background-color: #26343b;

            display: grid;

            grid-template-columns: repeat(12, 1fr);

            gap: 6px;

            border-radius: 12px;
        }

        .key {
            height: 45px;

            background-color: #34454d;

            color: white;

            border: 1px solid #18272d;

            border-radius: 4px;

            text-align: center;

            padding-top: 13px;

            font-family: Arial;

            font-size: 12px;
        }

    </style>

</head>

<body>

    <div class="keyboard">

        <div class="key">1</div>
        <div class="key">2</div>
        <div class="key">3</div>
        <div class="key">4</div>
        <div class="key">5</div>
        <div class="key">6</div>
        <div class="key">7</div>
        <div class="key">8</div>
        <div class="key">9</div>
        <div class="key">0</div>
        <div class="key">-</div>
        <div class="key">+</div>

        <div class="key">Q</div>
        <div class="key">W</div>
        <div class="key">E</div>
        <div class="key">R</div>
        <div class="key">T</div>
        <div class="key">Y</div>
        <div class="key">U</div>
        <div class="key">I</div>
        <div class="key">O</div>
        <div class="key">P</div>

        <div class="key">A</div>
        <div class="key">S</div>
        <div class="key">D</div>
        <div class="key">F</div>
        <div class="key">G</div>
        <div class="key">H</div>
        <div class="key">J</div>
        <div class="key">K</div>
        <div class="key">L</div>

        <div class="key">Z</div>
        <div class="key">X</div>
        <div class="key">C</div>
        <div class="key">V</div>
        <div class="key">B</div>
        <div class="key">N</div>
        <div class="key">M</div>

    </div>

</body>
</html>
