<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Rooms & Suites</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Georgia, serif;
            background-color: white;
        }

        .rooms-section {
            width: 1000px;
            max-width: 95%;
            margin: 50px auto;
        }

        h1 {
            text-align: center;
            color: #c9943d;
            font-size: 42px;
            margin-bottom: 15px;
        }

        .description {
            max-width: 650px;
            margin: auto;

            text-align: center;

            line-height: 1.6;
            color: #666;

            margin-bottom: 40px;
        }

        .room-container {
            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 18px;
        }

        .room-card {
            background-color: white;

            padding: 8px;

            text-align: center;

            box-shadow: 0 4px 15px #cccccc;
        }

        .room-card img {
            width: 100%;
            height: 200px;

            object-fit: cover;
        }

        .room-card h2 {
            font-size: 20px;
            margin: 15px 0 8px;
        }

        .price {
            color: #d89b3c;

            font-size: 13px;

            margin-bottom: 15px;
        }

    </style>

</head>

<body>

    <section class="rooms-section">

        <h1>Rooms & Suites</h1>

        <p class="description">
            Far far away, behind the word mountains, far from the countries
            Vokalia and Consonantia, there live the blind texts.
        </p>

        <div class="room-container">

            <div class="room-card">

                <img src="https://picsum.photos/seed/single/500/300">

                <h2>Single Room</h2>

                <p class="price">
                    $90 / PER NIGHT
                </p>

            </div>

            <div class="room-card">

                <img src="https://picsum.photos/seed/family/500/300">

                <h2>Family Room</h2>

                <p class="price">
                    $120 / PER NIGHT
                </p>

            </div>

            <div class="room-card">

                <img src="https://picsum.photos/seed/presidential/500/300">

                <h2>Presidential Room</h2>

                <p class="price">
                    $250 / PER NIGHT
                </p>

            </div>

        </div>

    </section>

</body>
</html>
