<!DOCTYPE html>
<html>
<head>
    <title>College Admission Application Form</title>
</head>

<body>

    <h1>College Admission Application Form</h1>

    <p>
        Welcome to the  GLA UNIVERSITY Admission Application.
        Please fill in all the required details carefully.
    </p>


    <form>

        <h2>Personal Details</h2>

        <label for="name">Full Name:</label>
        <input type="text"
               id="name"
               name="full_name"
               placeholder="Enter your full name"
               minlength="3"
               maxlength="50"
               required>
        <br><br>

        <label for="dob">Date of Birth:</label>
        <input type="date"
               id="dob"
               name="date_of_birth"
               required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="example@email.com"
               autocomplete="email"
               required>
        <br><br>

        <label for="mobile">Mobile Number:</label>
        <input type="tel"
               id="mobile"
               name="mobile"
               pattern="[0-9]{10}"
               placeholder="10-digit mobile number"
               required>
        <br><br>

        <label for="pin">Application PIN:</label>
        <input type="password"
               id="pin"
               name="application_pin"
               minlength="4"
               maxlength="8"
               required>
        <br><br>

        <p>Gender:</p>

        <input type="radio" id="male" name="gender" value="male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>

        <br><br>

        <label for="category">Category:</label>

        <select id="category" name="category" required>
            <option value="">-- Select Category --</option>
            <option value="general">General</option>
            <option value="obc">OBC</option>
            <option value="sc">SC</option>
            <option value="st">ST</option>
            <option value="ews">EWS</option>
        </select>

        <br><br>

        <label for="address">Permanent Address:</label>
        <br>

        <textarea id="address"
                  name="permanent_address"
                  rows="5"
                  cols="45"
                  maxlength="250"
                  required></textarea>

        <br><br>


        <h2>Course Selection</h2>

        <label for="course">Course / Program:</label>

        <select id="course" name="course" required>

            <option value="">-- Select Course --</option>
            <option value="cse">B.Tech CSE</option>
            <option value="aiml">B.Tech AI & ML</option>
            <option value="ds">B.Tech Data Science</option>
            <option value="ece">B.Tech ECE</option>
            <option value="eee">B.Tech EEE</option>
            <option value="me">B.Tech Mechanical Engineering</option>

        </select>

        <br><br>


        <h2>Previous Qualification</h2>

        <label for="qualification">Qualification:</label>

        <select id="qualification"
                name="qualification"
                required>

            <option value="">-- Select --</option>
            <option value="12th">12th / Intermediate</option>
            <option value="diploma">Diploma</option>

        </select>

        <br><br>

        <label for="percentage">Percentage / CGPA:</label>

        <input type="number"
               id="percentage"
               name="percentage"
               min="0"
               max="100"
               step="0.01"
               required>

        <br><br>

        <label for="year">Passing Year:</label>

        <input type="number"
               id="year"
               name="passing_year"
               min="2000"
               max="2026"
               required>

        <br><br>

        <label for="school">School / College Name:</label>

        <input type="text"
               id="school"
               name="school_college"
               maxlength="100"
               required>

        <br><br>


        <label for="document">Admission Document:</label>

        <input type="file"
               id="document"
               name="admission_document">

        <br><br>


        <input type="checkbox"
               id="declaration"
               name="declaration"
               value="accepted"
               required>

        <label for="declaration">
            I declare that the information provided is correct.
        </label>

        <br><br>


        <input type="submit" value="Submit Application">

        <input type="reset" value="Reset">

    </form>

</body>
</html>
