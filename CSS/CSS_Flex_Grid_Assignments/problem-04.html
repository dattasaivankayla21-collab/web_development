<!DOCTYPE html>
<html>
<head>

    <title>Grid Layout</title>

    <style>

        .container {
            width: 800px;

            max-width: 90%;

            margin: 60px auto;

            text-align: center;

            font-family: Arial;
        }

        .logos {
            display: grid;

            grid-template-columns: repeat(6, 1fr);

            gap: 15px;
        }

        .logo {
            padding: 25px 10px;

            border: 1px solid #eeeeee;

            box-shadow: 0 2px 8px #eeeeee;
        }

    </style>

</head>

<body>

    <main class="container">

        <h2>Meet Our 700+ Hiring Partners</h2>

        <div class="logos">

            <div class="logo">Company 1</div>
            <div class="logo">Company 2</div>
            <div class="logo">Company 3</div>
            <div class="logo">Company 4</div>
            <div class="logo">Company 5</div>
            <div class="logo">Company 6</div>

            <div class="logo">Company 7</div>
            <div class="logo">Company 8</div>
            <div class="logo">Company 9</div>
            <div class="logo">Company 10</div>
            <div class="logo">Company 11</div>
            <div class="logo">Company 12</div>

        </div>

    </main>

</body>
</html>
