<!DOCTYPE html>
<html>
<head>

    <title>Grid Layout</title>

    <style>

        .grid {
            width: 650px;

            max-width: 90%;

            margin: 50px auto;

            display: grid;

            grid-template-columns: repeat(4, 1fr);

            grid-template-rows: 100px 100px 100px;

            gap: 14px;
        }

        .box {
            background-color: #24836f;
        }

        .one {
            grid-column: 1;
        }

        .two {
            grid-column: 2 / 4;
        }

        .three {
            grid-column: 4;
        }

        .four {
            grid-column: 1 / 3;
        }

        .five {
            grid-column: 3;
        }

        .six {
            grid-column: 4;
        }

        .seven {
            grid-column: 1;
        }

        .eight {
            grid-column: 2;
        }

        .nine {
            grid-column: 3 / 5;
        }

    </style>

</head>

<body>

    <div class="grid">

        <div class="box one"></div>
        <div class="box two"></div>
        <div class="box three"></div>

        <div class="box four"></div>
        <div class="box five"></div>
        <div class="box six"></div>

        <div class="box seven"></div>
        <div class="box eight"></div>
        <div class="box nine"></div>

    </div>

</body>
</html>
