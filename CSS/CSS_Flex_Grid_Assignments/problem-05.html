<!DOCTYPE html>
<html>
<head>

    <title>Grid Area</title>

    <style>

        .container {
            width: 650px;

            max-width: 90%;

            margin: 60px auto;

            display: grid;

            grid-template-columns: 2fr 1fr 1fr;

            grid-template-rows: 150px 150px;

            gap: 6px;
        }

        .box {
            background-color: #444;

            color: white;

            padding: 20px;

            font-size: 25px;
        }

        .a {
            grid-area: 1 / 1 / 2 / 2;
        }

        .b {
            grid-area: 1 / 2 / 3 / 3;
        }

        .c {
            grid-area: 2 / 1 / 3 / 2;
        }

        .d {
            grid-area: 1 / 3 / 2 / 4;
        }

        .e {
            grid-area: 2 / 3 / 3 / 4;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="box a">A</div>

        <div class="box b">B</div>

        <div class="box c">C</div>

        <div class="box d">D</div>

        <div class="box e">E</div>

    </div>

</body>
</html>
