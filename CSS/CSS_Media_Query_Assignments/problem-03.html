<!DOCTYPE html>
<html>
<head>

    <title>Media Query Problem 3</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial;
        }

        .navbar {
            background-color: yellow;

            padding: 10px;

            font-size: 20px;
        }

        .layout {
            display: grid;

            grid-template-columns: 2fr 1fr;

            gap: 8px;

            padding: 8px;
        }

        .left {
            background-color: red;

            height: 300px;

            padding: 20px;
        }

        .right {
            background-color: #00ef3b;

            height: 300px;

            padding: 20px;
        }

        @media (max-width: 700px) {

            .layout {
                grid-template-columns: 1fr;
            }

            .left,
            .right {
                height: 180px;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">
        Navigation
    </div>

    <div class="layout">

        <div class="left">
            LEFT BOX
        </div>

        <div class="right">
            RIGHT BOX
        </div>

    </div>

</body>
</html>
