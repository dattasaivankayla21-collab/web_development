<!DOCTYPE html>
<html>
<head>

    <title>Doctors</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial;
        }

        .container {
            max-width: 1100px;

            margin: auto;

            padding: 30px;
        }

        .doctors {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 20px;
        }

        .doctor {
            text-align: center;

            border: 1px solid #eeeeee;

            box-shadow: 0 3px 12px #dddddd;
        }

        .doctor img {
            width: 100%;

            height: 200px;

            object-fit: cover;
        }

        .doctor h3 {
            margin-bottom: 5px;
        }

        .doctor p {
            color: #777;
        }

        .doctor button {
            background-color: #ff6b4a;

            color: white;

            border: none;

            padding: 10px 15px;

            margin-bottom: 20px;
        }

        .bottom {
            margin-top: 30px;

            display: grid;

            grid-template-columns: repeat(3, 1fr);

            gap: 20px;
        }

        .info {
            background-color: #f6f6f6;

            padding: 35px;

            text-align: center;
        }

        /* Medium */

        @media (max-width: 800px) {

            .doctors {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* Small */

        @media (max-width: 500px) {

            .doctors {
                grid-template-columns: 1fr;
            }

            .bottom {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <main class="container">

        <h2>Our Specialists</h2>

        <section class="doctors">

            <div class="doctor">

                <img src="https://preview.colorlib.com/theme/medino/assets/images/doctor1.jpg.webp">

                <h3>Doctor 1</h3>

                <p>Specialist</p>

                <button>Book Appointment</button>

            </div>

            <div class="doctor">

                <img src="https://preview.colorlib.com/theme/medino/assets/images/doctor1.jpg.webp">

                <h3>Doctor 2</h3>

                <p>Specialist</p>

                <button>Book Appointment</button>

            </div>

            <div class="doctor">

                <img src="https://preview.colorlib.com/theme/medino/assets/images/doctor1.jpg.webp">

                <h3>Doctor 3</h3>

                <p>Specialist</p>

                <button>Book Appointment</button>

            </div>

            <div class="doctor">

                <img src="https://preview.colorlib.com/theme/medino/assets/images/doctor1.jpg.webp">

                <h3>Doctor 4</h3>

                <p>Specialist</p>

                <button>Book Appointment</button>

            </div>

        </section>

        <section class="bottom">

            <div class="info">
                Qualified Doctors
            </div>

            <div class="info">
                Modern Facilities
            </div>

            <div class="info">
                24/7 Support
            </div>

        </section>

    </main>

</body>
</html>
