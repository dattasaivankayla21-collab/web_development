<!DOCTYPE html>
<html>
<head>

    <title>Media Query Problem 1</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial;
        }

        .navbar {
            background-color: yellow;

            padding: 10px;

            font-size: 22px;
        }

        .cards {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 8px;

            padding: 8px;
        }

        .card {
            height: 180px;

            padding: 20px;

            color: white;
        }

        .one {
            background-color: red;
        }

        .two {
            background-color: #00f33b;
        }

        .three {
            background-color: #5b62e8;
        }

        .four {
            background-color: #aaaaaa;
        }

        /* Medium Screen */

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* Small Screen */

        @media (max-width: 500px) {

            .cards {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>

<body>

    <div class="navbar">
        Navigation
    </div>

    <div class="cards">

        <div class="card one">
            Box 1
        </div>

        <div class="card two">
            Box 2
        </div>

        <div class="card three">
            Box 3
        </div>

        <div class="card four">
            Box 4
        </div>

    </div>

</body>
</html>
