<!DOCTYPE html>
<html>
<head>

    <title>News</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;

            background-color: #eef4ff;

            margin: 0;
        }

        .container {
            max-width: 950px;

            margin: 50px auto;
        }

        .news {
            display: flex;

            gap: 20px;
        }

        .card {
            flex: 1;

            background-color: white;

            padding: 25px;

            box-shadow: 0 3px 12px #ccd5e5;
        }

        .logos {
            display: flex;

            justify-content: space-around;

            background-color: white;

            padding: 25px;
        }

    </style>

</head>

<body>

    <main class="container">

        <h2>GLA In The News</h2>

        <section class="news">

            <div class="card">

                <h3>The Economic Times</h3>

                <p>
                    Education and career news.
                </p>

            </div>

            <div class="card">

                <h3>moneycontrol</h3>

                <p>
                    Latest institutional updates.
                </p>

            </div>

            <div class="card">

                <h3>VICE</h3>

                <p>
                    Stories and student experiences.
                </p>

            </div>

        </section>

        <h2>Our Investors, Who Believe in Us</h2>

        <div class="logos">

            <b>unitus</b>
            <b>ON</b>
            <b>indigoleaf</b>

        </div>

    </main>

</body>
</html>
